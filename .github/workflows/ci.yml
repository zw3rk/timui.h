name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NIX_CONFIG: |
    extra-experimental-features = nix-command flakes
    extra-substituters = https://cache.zw3rk.com
    extra-trusted-public-keys = loony-tools:pr9m4BkM/5/eSTZlkQyRt57Jz7OMBxNSUiMC4FkcNfk=

jobs:
  check:
    name: build + test + amalgamate (nix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: nix develop -c make check
      - run: nix develop -c make release-check
      # Golden staleness: if rendering drifted and tests/golden/*.txt weren't
      # regenerated, the regenerated files differ from the committed ones.
      - run: nix develop -c make goldens
      - run: git diff --exit-code -- tests/golden/

  visual-renderer:
    name: vt_gif renderer checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: nix develop -c make check-vt-gif-all

  www:
    name: static website + downloadable header
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: nix develop -c make www
      - run: git diff --exit-code -- www/timui.h
      - run: git diff --exit-code -- www/LICENSE
      - name: Compile llms.txt skeleton
        run: |
          mkdir -p build
          awk 'BEGIN{n=0; emit=0}
               /^```c$/{n++; if(n==2){emit=1; next}}
               /^```$/{if(emit) exit}
               emit{print}' www/llms.txt > build/llms_smoke.c
          nix develop -c cc -std=c99 -Wall -Wextra -Wpedantic -O2 -pthread \
            -Iwww build/llms_smoke.c -o build/llms_smoke

  vterm:
    name: libvterm round-trip (Tier A)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      # vt-test feeds the renderer's bytes through the neovim/Paul Evans
      # libvterm API and compares the resulting grid. Its own job keeps an
      # upstream vterm regression separate from the core build+test.
      - run: nix develop -c make vt-test

  sanitizers:
    name: ${{ matrix.san }} sanitizer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        san: [address, undefined, thread]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      # nix clang's sanitizer runtime works on Linux CI (it hangs on darwin —
      # see docs/DECISIONS.md / the ASAN memory note); hence ubuntu here.
      - run: nix develop -c make test-san SAN=${{ matrix.san }}
