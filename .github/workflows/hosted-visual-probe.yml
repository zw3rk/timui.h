name: Hosted visual probes

on:
  workflow_dispatch:
    inputs:
      frames:
        description: Frames to keep live smoke programs on screen before exit
        required: false
        default: "1800"
        type: string

concurrency:
  group: hosted-visual-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NIX_CONFIG: |
    extra-experimental-features = nix-command flakes
    extra-substituters = https://cache.zw3rk.com
    extra-trusted-public-keys = loony-tools:pr9m4BkM/5/eSTZlkQyRt57Jz7OMBxNSUiMC4FkcNfk=

jobs:
  macos-iterm2:
    name: macOS iTerm2 screenshot probe
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v27
        id: install-nix
        continue-on-error: true
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Run hosted iTerm2 probe
        env:
          TIMUI_HOSTED_NIX_STATUS: ${{ steps.install-nix.outcome }}
        run: bash tools/ci/hosted_visual_macos.sh "${{ inputs.frames }}"
      - name: Upload macOS visual evidence
        id: upload-macos-evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-visual-macos-iterm2
          path: artifacts/hosted-visual/macos
          if-no-files-found: error
          retention-days: 14
      - name: Upload macOS terminal sanity screenshot
        id: upload-macos-terminal-sanity
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/hosted-visual/macos/terminal-sanity.png
          if-no-files-found: ignore
          retention-days: 14
          archive: false
      - name: Upload iTerm2 API screenshot
        id: upload-macos-iterm2-api
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/hosted-visual/macos/iterm2-api-session.png
          if-no-files-found: ignore
          retention-days: 14
          archive: false
      - name: Upload iTerm2 window screenshot
        id: upload-macos-iterm2-window
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/hosted-visual/macos/iterm2-window-12s.png
          if-no-files-found: ignore
          retention-days: 14
          archive: false
      - name: Upload iTerm2 region screenshot
        id: upload-macos-iterm2-region
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/hosted-visual/macos/iterm2-region-12s.png
          if-no-files-found: ignore
          retention-days: 14
          archive: false
      - name: Upload iTerm2 screen screenshot at 12s
        id: upload-macos-iterm2-screen-12s
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/hosted-visual/macos/iterm2-screen-12s.png
          if-no-files-found: ignore
          retention-days: 14
          archive: false
      - name: Upload iTerm2 screen screenshot at 24s
        id: upload-macos-iterm2-screen-24s
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/hosted-visual/macos/iterm2-screen-24s.png
          if-no-files-found: ignore
          retention-days: 14
          archive: false
      - name: Summarize macOS visual evidence
        if: always()
        env:
          EVIDENCE_URL: ${{ steps.upload-macos-evidence.outputs.artifact-url }}
          TERMINAL_SANITY_URL: ${{ steps.upload-macos-terminal-sanity.outputs.artifact-url }}
          ITERM2_API_URL: ${{ steps.upload-macos-iterm2-api.outputs.artifact-url }}
          ITERM2_WINDOW_URL: ${{ steps.upload-macos-iterm2-window.outputs.artifact-url }}
          ITERM2_REGION_URL: ${{ steps.upload-macos-iterm2-region.outputs.artifact-url }}
          ITERM2_SCREEN_12S_URL: ${{ steps.upload-macos-iterm2-screen-12s.outputs.artifact-url }}
          ITERM2_SCREEN_24S_URL: ${{ steps.upload-macos-iterm2-screen-24s.outputs.artifact-url }}
        run: |
          evidence="artifacts/hosted-visual/macos/evidence.md"

          add_row() {
            name="$1"
            path="$2"
            url="$3"
            status="missing"
            if [ -f "${path}" ]; then
              status="captured"
            fi
            link="not uploaded"
            if [ -n "${url}" ]; then
              link="[open artifact](${url})"
            fi
            printf "| \`%s\` | %s | %s |\n" "${name}" "${status}" "${link}" >> "${GITHUB_STEP_SUMMARY}"
          }

          {
            echo "## macOS iTerm2 Visual Evidence"
            echo
            if [ -n "${EVIDENCE_URL}" ]; then
              echo "- Full evidence bundle: [hosted-visual-macos-iterm2](${EVIDENCE_URL})"
            else
              echo "- Full evidence bundle: not uploaded"
            fi
            echo
            echo "| Screenshot | Status | Link |"
            echo "| --- | --- | --- |"
          } >> "${GITHUB_STEP_SUMMARY}"

          add_row "terminal-sanity.png" "artifacts/hosted-visual/macos/terminal-sanity.png" "${TERMINAL_SANITY_URL}"
          add_row "iterm2-api-session.png" "artifacts/hosted-visual/macos/iterm2-api-session.png" "${ITERM2_API_URL}"
          add_row "iterm2-window-12s.png" "artifacts/hosted-visual/macos/iterm2-window-12s.png" "${ITERM2_WINDOW_URL}"
          add_row "iterm2-region-12s.png" "artifacts/hosted-visual/macos/iterm2-region-12s.png" "${ITERM2_REGION_URL}"
          add_row "iterm2-screen-12s.png" "artifacts/hosted-visual/macos/iterm2-screen-12s.png" "${ITERM2_SCREEN_12S_URL}"
          add_row "iterm2-screen-24s.png" "artifacts/hosted-visual/macos/iterm2-screen-24s.png" "${ITERM2_SCREEN_24S_URL}"

          {
            echo
            echo "> Inline thumbnails are published by the Visual screenshot summary job after both platform probes finish."
            if [ -f "${evidence}" ]; then
              echo
              echo "<details><summary>Evidence notes</summary>"
              echo
              sed -n '1,220p' "${evidence}"
              echo
              echo "</details>"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  windows-terminal:
    name: Windows Terminal screenshot + ConPTY probe
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        id: setup-msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            gcc
            util-linux
            mingw-w64-ucrt-x86_64-gcc
      - name: Run hosted Windows probe
        shell: pwsh
        env:
          TIMUI_MSYS2_LOCATION: ${{ steps.setup-msys2.outputs.msys2-location }}
        run: ./tools/ci/hosted_visual_windows.ps1 -Frames "${{ inputs.frames }}"
      - name: Upload Windows visual evidence
        id: upload-windows-evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-visual-windows-terminal
          path: artifacts/hosted-visual/windows
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows cmd sanity screenshot
        id: upload-windows-cmd-sanity
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/hosted-visual/windows/cmd-sanity.png
          if-no-files-found: ignore
          retention-days: 14
          archive: false
      - name: Upload Windows direct Sixel screenshot
        id: upload-windows-direct-sixel
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/hosted-visual/windows/windows-terminal-direct-sixel-12s.png
          if-no-files-found: ignore
          retention-days: 14
          archive: false
      - name: Upload Windows Terminal Sixel screenshot at 12s
        id: upload-windows-sixel-12s
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/hosted-visual/windows/windows-terminal-sixel-12s.png
          if-no-files-found: ignore
          retention-days: 14
          archive: false
      - name: Upload Windows Terminal Sixel screenshot at 24s
        id: upload-windows-sixel-24s
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/hosted-visual/windows/windows-terminal-sixel-24s.png
          if-no-files-found: ignore
          retention-days: 14
          archive: false
      - name: Summarize Windows visual evidence
        if: always()
        shell: pwsh
        env:
          EVIDENCE_URL: ${{ steps.upload-windows-evidence.outputs.artifact-url }}
          CMD_SANITY_URL: ${{ steps.upload-windows-cmd-sanity.outputs.artifact-url }}
          DIRECT_SIXEL_URL: ${{ steps.upload-windows-direct-sixel.outputs.artifact-url }}
          SIXEL_12S_URL: ${{ steps.upload-windows-sixel-12s.outputs.artifact-url }}
          SIXEL_24S_URL: ${{ steps.upload-windows-sixel-24s.outputs.artifact-url }}
        run: |
          $summary = $env:GITHUB_STEP_SUMMARY
          $evidence = "artifacts/hosted-visual/windows/evidence.md"
          $rows = @(
            @{ Name = "cmd-sanity.png"; Path = "artifacts/hosted-visual/windows/cmd-sanity.png"; Url = $env:CMD_SANITY_URL },
            @{ Name = "windows-terminal-direct-sixel-12s.png"; Path = "artifacts/hosted-visual/windows/windows-terminal-direct-sixel-12s.png"; Url = $env:DIRECT_SIXEL_URL },
            @{ Name = "windows-terminal-sixel-12s.png"; Path = "artifacts/hosted-visual/windows/windows-terminal-sixel-12s.png"; Url = $env:SIXEL_12S_URL },
            @{ Name = "windows-terminal-sixel-24s.png"; Path = "artifacts/hosted-visual/windows/windows-terminal-sixel-24s.png"; Url = $env:SIXEL_24S_URL }
          )

          Add-Content -Path $summary -Value "## Windows Terminal Visual Evidence"
          Add-Content -Path $summary -Value ""
          if ($env:EVIDENCE_URL) {
            Add-Content -Path $summary -Value "- Full evidence bundle: [hosted-visual-windows-terminal]($env:EVIDENCE_URL)"
          } else {
            Add-Content -Path $summary -Value "- Full evidence bundle: not uploaded"
          }
          Add-Content -Path $summary -Value ""
          Add-Content -Path $summary -Value "| Screenshot | Status | Link |"
          Add-Content -Path $summary -Value "| --- | --- | --- |"
          foreach ($row in $rows) {
            $status = if (Test-Path $row.Path) { "captured" } else { "missing" }
            $link = if ($row.Url) { "[open artifact]($($row.Url))" } else { "not uploaded" }
            Add-Content -Path $summary -Value "| ``$($row.Name)`` | $status | $link |"
          }
          Add-Content -Path $summary -Value ""
          Add-Content -Path $summary -Value "> Inline thumbnails are published by the Visual screenshot summary job after both platform probes finish."
          if (Test-Path $evidence) {
            Add-Content -Path $summary -Value ""
            Add-Content -Path $summary -Value "<details><summary>Evidence notes</summary>"
            Add-Content -Path $summary -Value ""
            Get-Content -Path $evidence -TotalCount 220 | Add-Content -Path $summary
            Add-Content -Path $summary -Value ""
            Add-Content -Path $summary -Value "</details>"
          }

  visual-summary:
    name: Visual screenshot summary
    runs-on: ubuntu-latest
    needs:
      - macos-iterm2
      - windows-terminal
    if: always()
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download hosted visual evidence
        id: download-visual-evidence
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: hosted-visual-*
          path: visual-artifacts
          merge-multiple: false
      - name: Publish inline screenshot gallery
        env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          SCREENSHOT_BRANCH: ci-screenshots
          RUN_PATH: runs/${{ github.run_id }}/${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail

          src_root="${GITHUB_WORKSPACE}/visual-artifacts"
          publish_root="${RUNNER_TEMP}/timui-screenshots-publish-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GH_REPO}.git"
          raw_base_url="https://raw.githubusercontent.com/${GH_REPO}/${SCREENSHOT_BRANCH}/${RUN_PATH}"
          blob_base_url="https://github.com/${GH_REPO}/blob/${SCREENSHOT_BRANCH}/${RUN_PATH}"
          run_url="https://github.com/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}"
          branch_run_url="https://github.com/${GH_REPO}/tree/${SCREENSHOT_BRANCH}/${RUN_PATH}"

          if git ls-remote --exit-code --heads "${remote_url}" "${SCREENSHOT_BRANCH}" >/dev/null 2>&1; then
            git clone --depth=1 --branch "${SCREENSHOT_BRANCH}" "${remote_url}" "${publish_root}"
          else
            mkdir -p "${publish_root}"
            git init -b "${SCREENSHOT_BRANCH}" "${publish_root}"
            git -C "${publish_root}" remote add origin "${remote_url}"
          fi

          cd "${publish_root}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p "${RUN_PATH}/macos" "${RUN_PATH}/windows"

          copy_named() {
            local platform="$1"
            local artifact="$2"
            local name="$3"
            local artifact_dir="${src_root}/${artifact}"
            local match=""

            if [ -d "${artifact_dir}" ]; then
              match="$(find "${artifact_dir}" -type f -name "${name}" -print -quit)"
            fi

            if [ -n "${match}" ]; then
              cp "${match}" "${RUN_PATH}/${platform}/${name}"
            fi
          }

          copy_named macos hosted-visual-macos-iterm2 terminal-sanity.png
          copy_named macos hosted-visual-macos-iterm2 iterm2-api-session.png
          copy_named macos hosted-visual-macos-iterm2 iterm2-window-12s.png
          copy_named macos hosted-visual-macos-iterm2 iterm2-region-12s.png
          copy_named macos hosted-visual-macos-iterm2 iterm2-screen-12s.png
          copy_named macos hosted-visual-macos-iterm2 iterm2-screen-24s.png
          copy_named macos hosted-visual-macos-iterm2 evidence.md

          copy_named windows hosted-visual-windows-terminal cmd-sanity.png
          copy_named windows hosted-visual-windows-terminal windows-terminal-direct-sixel-12s.png
          copy_named windows hosted-visual-windows-terminal windows-terminal-sixel-12s.png
          copy_named windows hosted-visual-windows-terminal windows-terminal-sixel-24s.png
          copy_named windows hosted-visual-windows-terminal evidence.md

          cat > "${RUN_PATH}/README.md" <<EOF
          # timui.h hosted visual evidence

          - Workflow run: ${run_url}
          - Attempt: ${GITHUB_RUN_ATTEMPT}
          - Source ref: ${GITHUB_REF_NAME}
          - Source SHA: ${GITHUB_SHA}
          EOF

          git add "${RUN_PATH}"
          if ! git diff --cached --quiet; then
            git commit -m "visual: publish run ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"

            pushed=0
            for attempt in 1 2 3; do
              if git push origin "HEAD:${SCREENSHOT_BRANCH}"; then
                pushed=1
                break
              fi

              if [ "${attempt}" -eq 3 ]; then
                break
              fi

              git fetch --depth=1 origin "${SCREENSHOT_BRANCH}"
              git rebase "origin/${SCREENSHOT_BRANCH}"
            done

            if [ "${pushed}" -ne 1 ]; then
              echo "failed to publish screenshots to ${SCREENSHOT_BRANCH}" >&2
              exit 1
            fi
          fi

          add_image() {
            local title="$1"
            local platform="$2"
            local name="$3"
            local file="${RUN_PATH}/${platform}/${name}"
            local raw_url="${raw_base_url}/${platform}/${name}"
            local blob_url="${blob_base_url}/${platform}/${name}"

            {
              echo "### ${title}"
              echo
              if [ -f "${file}" ]; then
                echo "[open file](${blob_url})"
                echo
                echo "<img width=\"900\" alt=\"${title}\" src=\"${raw_url}\">"
              else
                echo "_Missing: \`${name}\`_"
              fi
              echo
            } >> "${GITHUB_STEP_SUMMARY}"
          }

          {
            echo "## Hosted Visual Screenshot Gallery"
            echo
            echo "- Published branch path: [\`${SCREENSHOT_BRANCH}/${RUN_PATH}\`](${branch_run_url})"
            echo "- Workflow run: [${GITHUB_RUN_ID}](${run_url})"
            echo "- Full evidence bundles remain attached as job artifacts."
            echo
            echo "> The thumbnails below are loaded from the dedicated \`${SCREENSHOT_BRANCH}\` branch. If private-repository raw image rendering is blocked by GitHub, use the linked file or artifact bundle."
            echo
          } >> "${GITHUB_STEP_SUMMARY}"

          add_image "macOS Terminal sanity" macos terminal-sanity.png
          add_image "macOS iTerm2 API screenshot" macos iterm2-api-session.png
          add_image "macOS iTerm2 window at 12s" macos iterm2-window-12s.png
          add_image "macOS iTerm2 region at 12s" macos iterm2-region-12s.png
          add_image "macOS full screen at 12s" macos iterm2-screen-12s.png
          add_image "macOS full screen at 24s" macos iterm2-screen-24s.png
          add_image "Windows cmd sanity" windows cmd-sanity.png
          add_image "Windows direct Sixel at 12s" windows windows-terminal-direct-sixel-12s.png
          add_image "Windows Terminal Sixel at 12s" windows windows-terminal-sixel-12s.png
          add_image "Windows Terminal Sixel at 24s" windows windows-terminal-sixel-24s.png
