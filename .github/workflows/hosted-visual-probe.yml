name: Hosted visual probes

on:
  workflow_dispatch:
    inputs:
      frames:
        description: Frames to keep live smoke programs on screen before exit
        required: false
        default: "1800"
        type: string

concurrency:
  group: hosted-visual-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NIX_CONFIG: |
    extra-experimental-features = nix-command flakes
    extra-substituters = https://cache.zw3rk.com
    extra-trusted-public-keys = loony-tools:pr9m4BkM/5/eSTZlkQyRt57Jz7OMBxNSUiMC4FkcNfk=

jobs:
  macos-iterm2:
    name: macOS iTerm2 screenshot probe
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Run hosted iTerm2 probe
        run: bash tools/ci/hosted_visual_macos.sh "${{ inputs.frames }}"
      - name: Upload macOS visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-visual-macos-iterm2
          path: artifacts/hosted-visual/macos
          if-no-files-found: error
          retention-days: 14

  windows-terminal:
    name: Windows Terminal screenshot + ConPTY probe
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            util-linux
            mingw-w64-ucrt-x86_64-gcc
      - name: Run hosted Windows probe
        shell: pwsh
        run: ./tools/ci/hosted_visual_windows.ps1 -Frames "${{ inputs.frames }}"
      - name: Upload Windows visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-visual-windows-terminal
          path: artifacts/hosted-visual/windows
          if-no-files-found: error
          retention-days: 14
